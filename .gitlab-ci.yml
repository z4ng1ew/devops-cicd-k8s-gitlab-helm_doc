stages:
  - build
  - test
  - staging

variables:
  SERVICES: "session-service hotel-service booking-service payment-service loyalty-service report-service gateway-service"

build-job:
  stage: build
  image: maven:3.9-eclipse-temurin-17
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feature_/'
  script:
    - echo "=== Build start ==="
    - cd src/services
    - |
      for svc in $SERVICES; do
        echo ">>> Building $svc"
        cd $svc
        mvn package -DskipTests --batch-mode --settings maven-settings.xml
        cd ..
      done
    - echo "=== Build done ==="

unit-test-job:
  stage: test
  image: maven:3.9-eclipse-temurin-17
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feature_/'
  script:
    - echo "=== Unit tests start ==="
    - cd src/services
    - |
      for svc in $SERVICES; do
        echo ">>> Testing $svc"
        cd $svc
        mvn test --batch-mode --settings maven-settings.xml
        cd ..
      done
    - echo "=== Unit tests done ==="


newman-test-job:
  stage: test
  image:
    name: postman/newman:alpine
    entrypoint: [""]
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feature_/'
  script:
    - echo "=== Functional tests (newman) start ==="
    - newman run src/application_tests.postman_collection.json --insecure
    - echo "=== Functional tests done ==="

staging-job:
  stage: staging
  image: alpine/helm:3.14.0
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
  before_script:
    - apk add --no-cache curl bash
    - curl -LO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
    - chmod +x kubectl
    - mv kubectl /usr/local/bin/
  script:
    - echo "=== Staging deploy start ==="
    - kubectl get nodes
    - echo "=== Reading secrets from Kubernetes ==="
    - export POSTGRES_PASSWORD=$(kubectl get secret app-credentials -n gitlab-runner -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
    - export RABBIT_MQ_PASSWORD=$(kubectl get secret app-credentials -n gitlab-runner -o jsonpath='{.data.RABBIT_MQ_PASSWORD}' | base64 -d)
    - echo "Secrets loaded (values masked)"
    - cd src/hotels-app
    - |
      helm upgrade --install my-hotels . \
        --namespace hotels \
        --create-namespace \
        --set secrets.postgresPassword=$POSTGRES_PASSWORD \
        --set secrets.rabbitmqPassword=$RABBIT_MQ_PASSWORD \
        --timeout 5m
    - echo "=== Deploy done ==="
    - kubectl get pods -n hotels
    - echo "=== Staging complete ==="
















    # Построчный комментарий к `.gitlab-ci.yml`

```yaml
stages:                    # Объявляем последовательность этапов pipeline
  - build                  # 1-й этап: сборка приложения
  - test                   # 2-й этап: запуск тестов
  - staging                # 3-й этап: деплой на staging-окружение

variables:                 # Глобальные переменные, доступные во всех job'ах
  SERVICES: "session-service hotel-service booking-service payment-service loyalty-service report-service gateway-service"
                           # Список микросервисов, перебираемых в цикле for

build-job:                 # Job сборки
  stage: build             # Принадлежит этапу build
  image: maven:3.9-eclipse-temurin-17   # Docker-образ с Maven и JDK 17
  rules:                   # Условия запуска job
    - if: '$CI_COMMIT_BRANCH =~ /^feature_/'   # Запуск только для веток feature_*
  script:
    - echo "=== Build start ==="          # Лог начала сборки
    - cd src/services                     # Переход в каталог микросервисов
    - |                                   # Многострочный shell-блок
      for svc in $SERVICES; do            # Цикл по списку сервисов
        echo ">>> Building $svc"          # Лог текущего сервиса
        cd $svc                           # Заход в каталог сервиса
        mvn package -DskipTests --batch-mode --settings maven-settings.xml
                                          # Сборка без тестов, batch-режим, кастомный settings.xml
        cd ..                             # Возврат в каталог services
      done
    - echo "=== Build done ==="           # Лог завершения

unit-test-job:             # Job юнит-тестов
  stage: test              # Этап тестирования
  image: maven:3.9-eclipse-temurin-17
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feature_/'   # Только для feature_*
  script:
    - echo "=== Unit tests start ==="
    - cd src/services
    - |
      for svc in $SERVICES; do
        echo ">>> Testing $svc"
        cd $svc
        mvn test --batch-mode --settings maven-settings.xml   # Запуск mvn test
        cd ..
      done
    - echo "=== Unit tests done ==="

newman-test-job:           # Job функциональных тестов через Newman (Postman CLI)
  stage: test
  image:
    name: postman/newman:alpine            # Лёгкий образ с Newman
    entrypoint: [""]                       # Сбрасываем entrypoint, чтобы GitLab мог выполнить script
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^feature_/'
  script:
    - echo "=== Functional tests (newman) start ==="
    - newman run src/application_tests.postman_collection.json --insecure
                                           # Запуск Postman-коллекции; --insecure отключает проверку SSL
    - echo "=== Functional tests done ==="

staging-job:               # Job деплоя на staging
  stage: staging
  image: alpine/helm:3.14.0                # Образ с Helm для развёртывания в k8s
  rules:
    - if: '$CI_COMMIT_TAG'                 # Запуск только при наличии git-тега
      when: manual                         # Деплой запускается вручную
  before_script:                           # Подготовка окружения перед script
    - apk add --no-cache curl bash         # Ставим curl и bash в alpine
    - curl -LO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
                                           # Скачиваем kubectl
    - chmod +x kubectl                     # Делаем исполняемым
    - mv kubectl /usr/local/bin/           # Кладём в PATH
  script:
    - echo "=== Staging deploy start ==="
    - kubectl get nodes                    # Проверяем доступность кластера
    - echo "=== Reading secrets from Kubernetes ==="
    - export POSTGRES_PASSWORD=$(kubectl get secret app-credentials -n gitlab-runner -o jsonpath='{.data.POSTGRES_PASSWORD}' | base64 -d)
                                           # Достаём пароль PostgreSQL из k8s-секрета и декодируем base64
    - export RABBIT_MQ_PASSWORD=$(kubectl get secret app-credentials -n gitlab-runner -o jsonpath='{.data.RABBIT_MQ_PASSWORD}' | base64 -d)
                                           # Аналогично для RabbitMQ
    - echo "Secrets loaded (values masked)"   # Лог без раскрытия секретов
    - cd src/hotels-app                    # Переход в каталог Helm-чарта
    - |
      helm upgrade --install my-hotels . \  # Установка/обновление релиза my-hotels
        --namespace hotels \                # В namespace hotels
        --create-namespace \                # Создать namespace, если нет
        --set secrets.postgresPassword=$POSTGRES_PASSWORD \   # Передаём секрет в values
        --set secrets.rabbitmqPassword=$RABBIT_MQ_PASSWORD \  # Передаём секрет в values
        --timeout 5m                        # Таймаут на деплой 5 минут
    - echo "=== Deploy done ==="
    - kubectl get pods -n hotels           # Проверяем поднявшиеся поды
    - echo "=== Staging complete ==="
```

---

# Монолог для защиты (~300 символов)

> Мой CI/CD-пайплайн в GitLab состоит из трёх этапов: build, test и staging. На ветках feature_* собираются все микросервисы через Maven и проходят юнит- и функциональные тесты Newman. При создании git-тега вручную запускается деплой в Kubernetes через Helm, а пароли безопасно подтягиваются из k8s-секретов.