gitlabUrl: "https://git.21-school.ru"

image:
  registry: registry.gitlab.com
  image: gitlab-org/gitlab-runner
  tag: alpine-v16.11.0

concurrent: 4
checkInterval: 10
logLevel: info

runners:
  config: |
    [[runners]]
      [runners.kubernetes]
        namespace = "gitlab-runner"
        image = "ubuntu:22.04"
        cpu_request = "100m"
        cpu_limit = "1"
        memory_request = "256Mi"
        memory_limit = "2Gi"
        privileged = true

rbac:
  create: true
  rules:
    - resources: ["pods", "pods/exec", "pods/attach", "secrets", "configmaps"]
      verbs: ["get", "list", "watch", "create", "patch", "delete", "update"]
    - resources: ["pods/log"]
      verbs: ["get", "list"]
    - resources: ["events"]
      verbs: ["list", "watch"]

serviceAccount:
  create: true

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi
    