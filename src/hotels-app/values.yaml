# Построчный комментарий к `values.yaml` (Helm-чарт)

```yaml
replicaCount:              # Количество реплик (подов) для каждого компонента
  postgres: 1              # БД — один экземпляр (stateful)
  rabbitmq: 1              # Брокер сообщений — один экземпляр
  session: 1               # Сервис сессий/авторизации
  hotel: 1                 # Сервис отелей
  booking: 1               # Сервис бронирований
  payment: 1               # Сервис платежей
  loyalty: 1               # Сервис программы лояльности
  report: 1                # Сервис отчётов
  gateway: 2               # API Gateway — 2 реплики для отказоустойчивости и балансировки

image:
  pullPolicy: IfNotPresent # Тянуть образ только если его нет локально (экономия трафика)
  postgres: postgres:16.4-alpine@sha256:5660...
                           # Образ PostgreSQL, закреплён по digest для воспроизводимости
  rabbitmq: rabbitmq:3.12-management-alpine@sha256:0b44...
                           # RabbitMQ с management-плагином (web UI), также pinned по sha256
  session: src-session-service:0.3.0    # Собственный образ сервиса сессий, версия 0.3.0
  hotel:   src-hotel-service:0.3.0      # Образ сервиса отелей
  booking: src-booking-service:0.3.0    # Образ сервиса бронирований
  payment: src-payment-service:0.3.0    # Образ сервиса платежей
  loyalty: src-loyalty-service:0.3.0    # Образ сервиса лояльности
  report:  src-report-service:0.3.0     # Образ сервиса отчётов
  gateway: src-gateway-service:0.2.0    # Образ API Gateway

postgres:
  storage:
    size: 5Gi                           # Размер PersistentVolume для БД — 5 ГБ
    storageClassName: manual            # Класс хранилища — ручное создание PV
    hostPath: /var/lib/postgres-pv      # Путь на ноде, где физически хранятся данные

ingress:
  enabled: true                          # Включаем Ingress (внешний доступ через HTTP/HTTPS)
  sessionHost: session.10.174.8.95.nip.io  # Домен для session-сервиса (nip.io резолвит IP в DNS)
  gatewayHost: gateway.10.174.8.95.nip.io  # Домен для gateway
  tlsSecret: wildcard-nipio-tls          # K8s-секрет с TLS-сертификатом (wildcard)
  clusterIssuer: my-ca-issuer            # ClusterIssuer cert-manager для автогенерации сертификатов

secrets:                                 # Значения по умолчанию (в проде переопределяются через --set)
  postgresUser: "postgres"               # Логин БД
  postgresPassword: "postgres"           # Пароль БД (в CI берётся из k8s-секрета)
  rabbitmqUser: "guest"                  # Логин RabbitMQ
  rabbitmqPassword: "guest"              # Пароль RabbitMQ (тоже подменяется в CI)
  gatewayUuid: "b51ceda2-..."            # UUID для идентификации gateway во внутренних запросах
  bookingUuid: "911ccb4c-..."            # UUID для booking-сервиса
  jwtPrivateKey: "MIIEvQIBADAN..."       # Приватный RSA-ключ для подписи JWT-токенов (PKCS#8 base64)
  jwtPublicKey:  "MIIBIjANBgkq..."       # Публичный RSA-ключ для верификации JWT-токенов
```

---

# Монолог для защиты (~300 символов)

> Файл `values.yaml` — это конфигурация Helm-чарта. Здесь задаются количество реплик каждого микросервиса, образы с закреплёнными digest-ами, параметры PersistentVolume для PostgreSQL, настройки Ingress с TLS через cert-manager и nip.io, а также секреты: учётные данные БД, RabbitMQ и пара RSA-ключей для JWT.