# Монолог для защиты (~300 символов)

> Это Helm-шаблон PersistentVolume для PostgreSQL. PV использует hostPath с привязкой к ноде `k3s-master` через nodeAffinity, чтобы под Postgres всегда поднимался там, где физически лежат данные. Reclaim policy — Retain: данные не удаляются при удалении PVC. Размер и путь берутся из values.yaml.