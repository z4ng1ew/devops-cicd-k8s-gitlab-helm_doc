# Монолог для защиты (~300 символов)

> Report-service собирает статистику по бронированиям. Подписан на очередь `booking_statistics_queue` в RabbitMQ — booking шлёт туда события асинхронно. Развёрнут как Deployment с БД `statistics_db`. Event-driven подход разгружает основные сервисы и обеспечивает отказоустойчивость сбора метрик.