apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-service
  labels: { app: report-service }
spec:
  replicas: {{ .Values.replicaCount.report }}
  selector:
    matchLabels: { app: report-service }
  template:
    metadata:
      labels: { app: report-service }
    spec:
      containers:
        - name: report-service
          image: {{ .Values.image.report }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: POSTGRES_DB
              value: statistics_db
---
apiVersion: v1
kind: Service
metadata:
  name: report-service
  labels: { app: report-service }
spec:
  selector: { app: report-service }
  ports:
    - port: 8086
      targetPort: 8086
  type: ClusterIP
