# Монолог для защиты (~300 символов)

> Payment-service отвечает за платежи и возвраты. Развёрнут как stateless Deployment с собственной БД `payments_db`. Вызывается из booking-service при создании и отмене брони. Service типа ClusterIP — финансовый сервис изолирован от внешнего мира, доступ только через gateway и booking.