apiVersion: apps/v1
kind: Deployment
metadata:
  name: hotel-service
  labels: { app: hotel-service }
spec:
  replicas: {{ .Values.replicaCount.hotel }}
  selector:
    matchLabels: { app: hotel-service }
  template:
    metadata:
      labels: { app: hotel-service }
    spec:
      containers:
        - name: hotel-service
          image: {{ .Values.image.hotel }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: POSTGRES_DB
              value: hotels_db
---
apiVersion: v1
kind: Service
metadata:
  name: hotel-service
  labels: { app: hotel-service }
spec:
  selector: { app: hotel-service }
  ports:
    - port: 8082
      targetPort: 8082
  type: ClusterIP
