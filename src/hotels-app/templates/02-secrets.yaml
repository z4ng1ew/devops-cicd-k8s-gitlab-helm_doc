# Монолог для защиты (~300 символов)

> Это Helm-шаблон Secret'а `app-secrets`. Через `stringData` я передаю учётки PostgreSQL и RabbitMQ, служебные UUID и пару RSA-ключей для JWT. Значения подтягиваются из `values.yaml` с дефолтами, а в CI пароли переопределяются через `--set` из k8s-секрета. K8s сам закодирует stringData в base64.