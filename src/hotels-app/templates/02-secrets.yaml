  # Построчный комментарий к `secret.yaml` (Helm-шаблон)

```yaml
apiVersion: v1                              # Версия API Kubernetes для Secret
kind: Secret                                # Тип ресурса — Secret (зашифрованное хранилище)
metadata:
  name: app-secrets                         # Имя секрета; используется в Deployment'ах через envFrom
type: Opaque                                # Тип Opaque — произвольные пары ключ-значение

stringData:                                 # В отличие от data, здесь значения в plain text,
                                            # k8s сам закодирует их в base64 при создании

  POSTGRES_USER: {{ .Values.secrets.postgresUser | default "postgres" | quote }}
                                            # Логин PostgreSQL.
                                            # {{ .Values.* }} — значение из values.yaml,
                                            # | default — дефолт, если не задано,
                                            # | quote — обернуть в кавычки (требование YAML)

  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | default "postgres" | quote }}
                                            # Пароль БД; в CI переопределяется через --set
                                            # из k8s-секрета app-credentials

  RABBIT_MQ_USER: {{ .Values.secrets.rabbitmqUser | default "guest" | quote }}
                                            # Логин RabbitMQ (по умолчанию guest)

  RABBIT_MQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | default "guest" | quote }}
                                            # Пароль RabbitMQ; тоже подменяется в CI

  GATEWAY_SERVICE_UUID: {{ .Values.secrets.gatewayUuid | default "b51ceda2-..." | quote }}
                                            # UUID для идентификации gateway во внутренних запросах
                                            # между микросервисами

  BOOKING_SERVICE_UUID: {{ .Values.secrets.bookingUuid | default "911ccb4c-..." | quote }}
                                            # UUID для booking-сервиса (служебная авторизация)

  JWT_PRIVATE_KEY: {{ .Values.secrets.jwtPrivateKey | quote }}
                                            # Приватный RSA-ключ для подписи JWT-токенов
                                            # (используется session-service)

  JWT_PUBLIC_KEY: {{ .Values.secrets.jwtPublicKey | quote }}
                                            # Публичный RSA-ключ для верификации JWT
                                            # (используется gateway и другими сервисами)
```

> **Принцип Helm-шаблонизации:** при `helm install/upgrade` Helm подставляет значения из `values.yaml` (или из `--set`) в шаблон, и k8s получает уже готовый Secret. Поэтому одни и те же чарты можно разворачивать в dev/stage/prod с разными секретами.

