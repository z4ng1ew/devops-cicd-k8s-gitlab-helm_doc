apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  labels: { app: gateway-service }
spec:
  replicas: {{ .Values.replicaCount.gateway }}
  selector:
    matchLabels: { app: gateway-service }
  template:
    metadata:
      labels: { app: gateway-service }
    spec:
      containers:
        - name: gateway-service
          image: {{ .Values.image.gateway }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  labels: { app: gateway-service }
spec:
  selector: { app: gateway-service }
  ports:
    - port: 8087
      targetPort: 8087
  type: ClusterIP
