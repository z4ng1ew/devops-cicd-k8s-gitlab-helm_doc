apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  labels: { app: booking-service }
spec:
  replicas: {{ .Values.replicaCount.booking }}
  selector:
    matchLabels: { app: booking-service }
  template:
    metadata:
      labels: { app: booking-service }
    spec:
      containers:
        - name: booking-service
          image: {{ .Values.image.booking }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: POSTGRES_DB
              value: reservations_db
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
  labels: { app: booking-service }
spec:
  selector: { app: booking-service }
  ports:
    - port: 8083
      targetPort: 8083
  type: ClusterIP
